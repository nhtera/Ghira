# SPDX-License-Identifier: Apache-2.0
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Cancel superseded PR runs only; every push to main gets a full run.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Repo policy checks and the webview CSP test. Cheap, so they run on Linux.
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: SPDX headers
        run: ./tools/scripts/check-spdx.sh
      - name: Network egress only in ghi-net (RT-6)
        run: ./tools/scripts/check-net-egress.sh
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: CSP blocks remote origins (RT-6)
        working-directory: apps/desktop
        run: |
          pnpm exec playwright install --with-deps chromium webkit
          pnpm test:e2e
      - name: Keep the Playwright failures
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-e2e-failures
          path: apps/desktop/test-results
          retention-days: 7

  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: true # NeMo-Speech.cpp only; its own submodules are fetched by the smoke script
      # SQLCipher's vendored OpenSSL configures with Perl; Git for Windows' perl
      # lacks Locale::Maketext::Simple, so point openssl-src at Strawberry Perl.
      - name: Strawberry Perl for the vendored OpenSSL (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: echo 'OPENSSL_SRC_PERL=C:\Strawberry\perl\bin\perl.exe' >> "$GITHUB_ENV"
      - name: Rust toolchain (from rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      # Models are cached once the registry exists (phase 3). CI jobs only:
      # release builds never restore caches (RT-12).
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: hashFiles('crates/ghi-models/registry*.toml') != ''
        with:
          path: models
          key: models-${{ hashFiles('crates/ghi-models/registry*.toml') }}
      - run: pnpm install --frozen-lockfile
      # The desktop crate embeds the frontend at compile time, so build it first.
      - run: pnpm build
      - run: cargo fmt --all --check
      - name: cargo clippy
        shell: bash
        run: |
          # ghi-mobile is iOS only (as in tools/scripts/check-windows.sh); the
          # ios job lints it for its real target.
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            cargo clippy --workspace --exclude ghi-mobile --all-targets --locked -- -D warnings
          else
            cargo clippy --workspace --all-targets --locked -- -D warnings
          fi
      - name: cargo test
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            # The lib test exe of a Tauri crate lacks the Common Controls v6
            # manifest on Windows and cannot start (tauri#11028, tauri#13419).
            # Their tests are platform-independent and run on macOS.
            cargo test --workspace --locked --exclude ghi-desktop --exclude ghi-mobile
          else
            cargo test --workspace --locked
          fi
      # Sync (phase 15) fuzz targets: type-check only here (the 60 s runs are
      # `cargo +nightly fuzz run <target>`, see CLAUDE.md). A standalone crate,
      # not in the workspace, so the workspace steps never see it.
      - name: Sync fuzz targets (build only)
        if: runner.os == 'macOS'
        run: |
          rustup toolchain install nightly --profile minimal
          cargo +nightly check --manifest-path crates/ghi-sync/fuzz/Cargo.toml --bins
      - name: Tauri build (unsigned, no bundle)
        working-directory: apps/desktop
        run: pnpm tauri build --no-bundle -- --locked
      # RT-12: the debug-only file key store must not reach release binaries.
      - name: No dev key in release binaries
        shell: bash
        run: |
          cargo build --release --locked -p ghi-cli
          exe=""; [[ "$RUNNER_OS" == "Windows" ]] && exe=".exe"
          ./tools/scripts/check-no-dev-key.sh "target/release/ghi$exe" "target/release/ghi-desktop$exe"
      # Speaker embedder (pure Rust, no native deps). Without the model the
      # parity tests skip; the fbank test still runs.
      - name: Voice embedder (tract)
        run: |
          cargo clippy --locked -p ghi-speech --features voice --all-targets -- -D warnings
          cargo test --locked -p ghi-speech --features voice
      # Voice profiles in core and the CLI (matching, learning, `ghi voice`).
      - name: Voice profiles (core, CLI)
        run: |
          cargo clippy --locked -p ghi-core -p ghi-cli --features ghi-cli/voice --all-targets -- -D warnings
          cargo test --locked -p ghi-core -p ghi-cli --features ghi-cli/voice
      - name: NeMo-Speech.cpp build
        shell: bash
        env:
          NEMO_BUILD_ROOT: ${{ runner.temp }}/nemo
        run: ./tools/scripts/build-nemo.sh
      # Engine tests with the pinned models (cached above). CPU: hosted runners
      # have no usable Metal. Windows links the DLL differently (phase 13).
      - name: Speech engine tests
        if: runner.os == 'macOS'
        shell: bash
        env:
          NEMO_SPEECH_DIR: ${{ runner.temp }}/nemo/install
          GHI_DEVICE: cpu
        run: |
          cargo clippy --locked -p ghi-speech -p ghi-cli --all-targets --features ghi-cli/nemo -- -D warnings
          ./tools/scripts/fetch-models.sh
          cargo test --locked -p ghi-speech -p ghi-cli --features ghi-cli/nemo
      # The optional Whisper final pass: static whisper.cpp, built and linted
      # (its unit tests need no model; the real-model tests are #[ignore]d).
      - name: Whisper final pass (build, lint, unit tests)
        if: runner.os == 'macOS'
        shell: bash
        env:
          WHISPER_BUILD_ROOT: ${{ runner.temp }}/whisper
          NEMO_SPEECH_DIR: ${{ runner.temp }}/nemo/install
          GHI_DEVICE: cpu
        run: |
          git submodule update --init --depth 1 third_party/whisper.cpp
          ./tools/scripts/build-whisper.sh
          export WHISPER_CPP_DIR="$WHISPER_BUILD_ROOT/install"
          cargo clippy --locked -p ghi-speech -p ghi-core -p ghi-cli --all-targets --features ghi-cli/nemo,ghi-cli/whisper -- -D warnings
          cargo test --locked -p ghi-speech --features whisper
          cargo build --release --locked -p ghi-cli --features nemo,whisper
          ./tools/scripts/check-no-ggml-export.sh target/release/ghi

  # iOS app (phases 7, 16): the simulator build, the Rust tests on the simulator,
  # the mobile UI on WebKit, the XCUITest flows with scripted engines (no models),
  # and the guard that no test hook reaches a release build. Device builds need
  # the owner's signing team (apps/mobile/scripts/build-ios.sh).
  ios:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: true
      - name: Rust toolchain (from rust-toolchain.toml)
        run: rustup toolchain install && rustup target add aarch64-apple-ios aarch64-apple-ios-sim
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - name: Xcode 26 (iOS 26 SDK; the Live Activity and share extension need it)
        run: |
          app="$(find /Applications -maxdepth 1 -name 'Xcode_26*.app' | sort -V | tail -1)"
          [[ -n "$app" ]] || { echo "::error::no Xcode 26.x on this runner image"; exit 1; }
          sudo xcode-select -s "$app"
          xcodebuild -version
      - name: An iPhone simulator on the newest iOS runtime (every script honours GHI_SIM_UDID)
        run: |
          echo "GHI_SIM_UDID=$(./apps/mobile/scripts/sim.sh create)" >> "$GITHUB_ENV"
      - run: brew install xcodegen
      - run: pnpm install --frozen-lockfile
      - name: NeMo-Speech.cpp for the iOS simulator
        env:
          NEMO_IOS_ROOT: ${{ github.workspace }}/target/nemo-ios
        run: ./tools/scripts/build-nemo-ios.sh ios-sim
      # The app crate embeds the frontend at compile time.
      - run: pnpm --filter @ghi/mobile build
      - name: Mobile UI (typecheck, lint, unit)
        run: pnpm --filter @ghi/mobile typecheck && pnpm --filter @ghi/mobile lint && pnpm --filter @ghi/mobile test
      - name: Mobile UI on WebKit at iPhone size (light/dark, EN/VI, 200%, axe)
        working-directory: apps/mobile
        run: |
          pnpm exec playwright install --with-deps webkit
          pnpm exec playwright test
      - name: Keep the Playwright failures
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mobile-e2e-failures
          path: apps/mobile/test-results
          retention-days: 7
      - name: Clippy (iOS, with the engine)
        run: cargo clippy --locked -p ghi-mobile --features ghi-mobile/nemo --target aarch64-apple-ios-sim -- -D warnings
      - name: Release build has no test hooks or dev key (RT-12)
        run: |
          cargo build --release --locked --lib -p ghi-mobile --features ghi-mobile/nemo --target aarch64-apple-ios-sim
          lib=target/aarch64-apple-ios-sim/release/libghi_mobile_lib.a
          ./tools/scripts/check-no-test-hooks.sh "$lib"
          ./tools/scripts/check-no-dev-key.sh "$lib"
      - name: Simulator app build
        run: |
          ./apps/mobile/scripts/build-ios.sh --sim
          ./tools/scripts/check-no-test-hooks.sh apps/mobile/src-tauri/gen/apple/build/arm64-sim/Ghira.app
      - name: Simulator app build with the test hooks
        run: ./apps/mobile/scripts/build-ios.sh --sim --test-hooks
      # The hooked build must trip the check, or the check is blind.
      - name: The hook check detects the hooks
        run: |
          ./tools/scripts/check-no-test-hooks.sh --expect-hooks \
            apps/mobile/src-tauri/gen/apple/build/arm64-sim/Ghira.app \
            target/aarch64-apple-ios-sim/debug/libghi_mobile_lib.a
      - name: Rust tests on the simulator (store, core, mobile)
        run: |
          ./apps/mobile/scripts/sim.sh boot
          ./apps/mobile/scripts/test-ios-sim.sh -p ghi-store -p ghi-core -p ghi-mobile
      - name: XCUITest flows (fake microphone, scripted engines)
        run: ./native/ios/GhiUITests/flows.sh
      - name: XCUITest lifecycle smoke
        run: |
          ./apps/mobile/scripts/sim.sh install
          ./apps/mobile/scripts/sim.sh grant
          ./native/ios/GhiUITests/run.sh -only-testing:GhiUITests/SmokeTests/testLaunchShowsTheApp
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: xcuitest-results
          path: native/ios/GhiUITests/build/Logs/Test
          retention-days: 7

  # Eval harness (phase 2): unit tests, plus one scored run on a text-only
  # fixture. Real and public audio never enters CI.
  eval:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        working-directory: tools/eval
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      # SQLCipher's vendored OpenSSL configures with Perl; Git for Windows' perl
      # lacks Locale::Maketext::Simple, so point openssl-src at Strawberry Perl.
      - name: Strawberry Perl for the vendored OpenSSL (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: echo 'OPENSSL_SRC_PERL=C:\Strawberry\perl\bin\perl.exe' >> "$GITHUB_ENV"
      # The real `ghi` binary, so the harness is tested against the CLI contract.
      - name: Rust toolchain (from rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: eval
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build ghi
        run: cargo build -p ghi-cli --locked
      - run: uv sync --locked
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run pytest -q
        env:
          GHI_BIN: ${{ github.workspace }}/target/debug/ghi${{ runner.os == 'Windows' && '.exe' || '' }}
      - name: Scored run on the text-only fixture
        run: >-
          uv run ghi-eval run --dataset tests/fixtures/tiny
          --system files:tests/fixtures/tiny-hyp --run-id ci
          --tasks asr,diar,notes --out "$RUNNER_TEMP/eval-run"
