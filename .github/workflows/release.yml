# SPDX-License-Identifier: Apache-2.0
# Release skeleton (RT-12). Runs only for version tags, never for PRs.
# Builds from a clean checkout with --locked and no cache restore, inside the
# protected `release` environment. The updater manifest is signed offline by
# the owner, not here. macOS only until phase 13 (Windows).
#
# Signing is optional by construction: with no Apple secrets in the
# environment the pipeline still runs end to end and produces an unsigned
# bundle; adding the secrets turns on Developer ID signing, notarization and
# stapling. Secrets are only given to the steps that sign.
#
# A tag push runs the workflow file from the tagged commit, so the in-workflow
# tag check below is defence in depth. The binding controls are GitHub
# settings the owner configures: a tag ruleset limiting who may create or move
# `v*` tags, and a `release` environment that only accepts `v*` tags and
# requires a reviewer.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  verify-tag:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify the tag signature and what it points at
        run: |
          tag="${GITHUB_REF_NAME}"
          git fetch --force origin "refs/tags/${tag}:refs/tags/${tag}" main
          # Trust the signer list on main, not the one in the tagged tree.
          git show origin/main:.github/allowed_signers > "$RUNNER_TEMP/allowed_signers"
          git config gpg.ssh.allowedSignersFile "$RUNNER_TEMP/allowed_signers"
          git tag -v "$tag"
          # `git tag -v` does not check the tag's own name or target, so check
          # that the signed tag object is this tag, points at the commit being
          # built, and that the commit is on main.
          test "$(git cat-file tag "$tag" | sed -n 's/^tag //p')" = "$tag"
          test "$(git rev-parse "${tag}^{commit}")" = "$GITHUB_SHA"
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main

  build:
    needs: verify-tag
    environment: release
    runs-on: macos-14
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: true
      - run: rustup toolchain install
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22 # no `cache:` here: release builds never restore caches
      - run: pnpm install --frozen-lockfile
      - id: creds
        name: Are signing secrets configured?
        env:
          HAS_CERT: ${{ secrets.APPLE_CERTIFICATE != '' }}
        run: echo "signed=$HAS_CERT" >> "$GITHUB_OUTPUT"
      - name: Stage the worker and NeMo-Speech.cpp dylibs
        # No secrets: third-party build scripts run here.
        run: tools/release/stage-bundle.sh
      - name: Build (no bundle, no secrets)
        working-directory: apps/desktop
        run: pnpm tauri build --no-bundle --features nemo,whisper --config src-tauri/tauri.release.conf.json -- --locked
      - name: Bundle, sign, notarize and staple the app (Developer ID)
        if: steps.creds.outputs.signed == 'true'
        working-directory: apps/desktop
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          export APPLE_API_KEY_PATH="$RUNNER_TEMP/AuthKey.p8"
          printf '%s' "$APPLE_API_KEY_P8" > "$APPLE_API_KEY_PATH"
          pnpm tauri bundle --bundles app --features nemo,whisper --config src-tauri/tauri.release.conf.json
          rm -f "$APPLE_API_KEY_PATH"
      - name: Bundle the app (unsigned, no secrets configured)
        if: steps.creds.outputs.signed != 'true'
        working-directory: apps/desktop
        run: |
          printf '%s' '{ "bundle": { "macOS": { "signingIdentity": "-", "hardenedRuntime": false } } }' > "$RUNNER_TEMP/adhoc.json"
          pnpm tauri bundle --bundles app --features nemo,whisper --config src-tauri/tauri.release.conf.json --config "$RUNNER_TEMP/adhoc.json"
      - name: Check the bundle
        run: |
          app=target/release/bundle/macos/Ghira.app
          otool -l "$app/Contents/MacOS/ghi-desktop" | grep -A2 LC_RPATH | grep -q '@executable_path/../Frameworks'
          test -x "$app/Contents/MacOS/ghi-llm-worker"
          # The static whisper.cpp ggml must stay private next to NeMo's dynamic one.
          ./tools/scripts/check-no-ggml-export.sh "$app/Contents/MacOS/ghi-desktop"
          codesign --verify --deep --strict --verbose=2 "$app"
      - name: DMG
        run: |
          version="${GITHUB_REF_NAME#v}"
          mkdir -p dist stage
          cp -R target/release/bundle/macos/Ghira.app stage/
          ln -s /Applications stage/Applications
          hdiutil create -volname Ghira -srcfolder stage -ov -format UDZO "dist/Ghira_${version}_aarch64.dmg"
      - name: Sign, notarize and staple the DMG
        if: steps.creds.outputs.signed == 'true'
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          key="$RUNNER_TEMP/AuthKey.p8"
          printf '%s' "$APPLE_API_KEY_P8" > "$key"
          dmg="$(ls dist/*.dmg)"
          codesign --timestamp --sign "$APPLE_SIGNING_IDENTITY" "$dmg"
          xcrun notarytool submit "$dmg" --key "$key" --key-id "$APPLE_API_KEY" --issuer "$APPLE_API_ISSUER" --wait --output-format json > dist/notarytool-dmg.json
          rm -f "$key"
          xcrun stapler staple "$dmg"
          spctl --assess --type open --context context:primary-signature --verbose "$dmg"
      - name: Update archive (after stapling) and unsigned manifest
        # ditto keeps the signature and stapled ticket; the app unpacks it
        # with ditto too (crates/ghi-update).
        run: |
          version="${GITHUB_REF_NAME#v}"
          archive="dist/Ghira_${version}_aarch64.app.zip"
          ditto -c -k --sequesterRsrc --keepParent target/release/bundle/macos/Ghira.app "$archive"
          sha="$(shasum -a 256 "$archive" | cut -d' ' -f1)"
          size="$(stat -f %z "$archive")"
          printf '{"version":"%s","min_macos":"14.2","archive":{"file":"%s","sha256":"%s","size":%s}}\n' \
            "$version" "$(basename "$archive")" "$sha" "$size" > dist/update-manifest.unsigned.json
      - name: Debug symbols
        run: |
          for d in target/release/ghi-desktop.dSYM target/release/ghi-llm-worker.dSYM; do
            if [ -d "$d" ]; then ditto -c -k --keepParent "$d" "dist/$(basename "$d").zip"; fi
          done
      - uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        with:
          tool: cargo-about@0.9.2,cargo-cyclonedx
      - name: Notices and SBOMs
        run: |
          cargo about generate about.hbs -o dist/THIRD_PARTY_NOTICES.html
          cargo cyclonedx --manifest-path apps/desktop/src-tauri/Cargo.toml --format json --override-filename sbom-rust
          cp apps/desktop/src-tauri/sbom-rust.json dist/
          (cd apps/desktop && npx --yes @cyclonedx/cyclonedx-npm --omit dev --output-file ../../dist/sbom-js.json)
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ghira-${{ github.ref_name }}-macos
          path: dist/
          if-no-files-found: error

  draft-release:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ghira-${{ github.ref_name }}-macos
          path: dist
      - name: Draft release (published by the owner after the manifest is signed)
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --draft --verify-tag --repo "$GITHUB_REPOSITORY" --title "Ghira $GITHUB_REF_NAME"
