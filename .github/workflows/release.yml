# SPDX-License-Identifier: Apache-2.0
# Release skeleton (RT-12). Runs only for version tags, never for PRs.
# Builds from a clean checkout with --locked and no cache restore, inside the
# protected `release` environment. The updater manifest is signed offline by
# the owner, not here.
#
# A tag push runs the workflow file from the tagged commit, so the in-workflow
# tag check below is defence in depth. The binding controls are GitHub
# settings the owner configures: a tag ruleset limiting who may create or move
# `v*` tags, and a `release` environment that only accepts `v*` tags and
# requires a reviewer.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  verify-tag:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify the tag signature and what it points at
        run: |
          tag="${GITHUB_REF_NAME}"
          git fetch --force origin "refs/tags/${tag}:refs/tags/${tag}" main
          # Trust the signer list on main, not the one in the tagged tree.
          git show origin/main:.github/allowed_signers > "$RUNNER_TEMP/allowed_signers"
          git config gpg.ssh.allowedSignersFile "$RUNNER_TEMP/allowed_signers"
          git tag -v "$tag"
          # `git tag -v` does not check the tag's own name or target, so check
          # that the signed tag object is this tag, points at the commit being
          # built, and that the commit is on main.
          test "$(git cat-file tag "$tag" | sed -n 's/^tag //p')" = "$tag"
          test "$(git rev-parse "${tag}^{commit}")" = "$GITHUB_SHA"
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main

  build:
    needs: verify-tag
    environment: release
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: true
      - run: rustup toolchain install
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22 # no `cache:` here: release builds never restore caches
      - run: pnpm install --frozen-lockfile
      - name: Build (unsigned)
        working-directory: apps/desktop
        # No secrets in this step: third-party build scripts run here.
        run: pnpm tauri build -- --locked
      # Signing is added in phase 12 as separate steps after the build, with
      # secrets scoped to those steps and to their OS only:
      #   macOS: codesign (Developer ID) + notarytool + stapler, .p8 key written
      #          from a secret to $RUNNER_TEMP;
      #   Windows: Certum Open Source Code Signing (cloud).
      # Until the release environment can require reviewers (public repo, or a
      # GitHub plan that supports it for private repos), no signing secrets exist.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ghi-${{ github.ref_name }}-${{ matrix.os }}
          path: |
            target/release/bundle/dmg/*.dmg
            target/release/bundle/macos/*.app
            target/release/bundle/nsis/*.exe
            target/release/bundle/msi/*.msi
          if-no-files-found: error
