# SPDX-License-Identifier: Apache-2.0
# Dependency policy (docs/05 §4.1): permissive licenses only, no network crates
# outside ghi-net, no known vulnerabilities. Runs weekly too, for new advisories.
name: Licenses

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 2 * * 1"

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - name: No HTTP client on desktop targets
        # deny.toml lets tauri wrap reqwest because Tauri uses it on iOS/Android only.
        # Fail if a Tauri update ever pulls it onto macOS or Windows.
        run: |
          for target in aarch64-apple-darwin x86_64-apple-darwin x86_64-pc-windows-msvc; do
            # Exits 0 with empty stdout when reqwest is not in the graph.
            if [[ -n "$(cargo tree --locked -i reqwest --target "$target" -e normal 2>/dev/null)" ]]; then
              echo "::error::reqwest is in the $target dependency graph"
              exit 1
            fi
          done
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check licenses bans advisories sources
      - uses: taiki-e/install-action@183e4297cca2404691e9380e1307288dced5c82a # v2.87.25
        with:
          tool: cargo-about@0.9.2
      - name: Third-party notices
        run: cargo about generate about.hbs -o THIRD_PARTY_NOTICES.html
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: third-party-notices
          path: THIRD_PARTY_NOTICES.html

  js:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build # writes apps/desktop/dist/third-party-js.json (bundled packages)
      - run: pnpm check:licenses

  # The About -> Licenses data is generated and committed: it must match the
  # lockfiles, the vendored texts and the submodule pin (pnpm gen:licenses[:mobile]).
  generated:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: true # NeMo-Speech.cpp LICENSE / NOTICE texts
      # ggml's LICENSE lives in NeMo's own nested submodule; only that one is
      # fetched (as tools/scripts/build-nemo.sh does), never kenlm (LGPL).
      - run: git -C third_party/NeMo-Speech.cpp submodule update --init --depth 1 ggml
      - run: rustup toolchain install
      - uses: taiki-e/install-action@183e4297cca2404691e9380e1307288dced5c82a # v2.87.25
        with:
          tool: cargo-about@0.9.2
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build # writes dist/third-party-js.json for both apps
      - run: pnpm gen:licenses && pnpm gen:licenses:mobile
      - name: Committed notices are current
        run: git diff --exit-code -- apps/desktop/src/generated apps/mobile/src/generated
