# SPDX-License-Identifier: Apache-2.0
# Every commit in a PR needs `Signed-off-by:` matching its author (git commit -s).
# A PR runs its own copy of this file, so this check is only binding together
# with branch protection + CODEOWNERS review of .github/ (owner settings).
name: DCO

on:
  pull_request:

permissions:
  contents: read

jobs:
  dco:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Check sign-off
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          # Collect first so a git error fails the job instead of passing silently.
          shas="$(git rev-list --no-merges "$BASE..$HEAD")" || exit 1
          status=0
          for sha in $shas; do
            author="$(git log -1 --format='%an <%ae>' "$sha")"
            # Bots (e.g. Dependabot) sign off with an address that differs from
            # their author address; their changes are reviewed like any PR.
            if [[ "$(git log -1 --format='%an' "$sha")" == *"[bot]" ]]; then
              continue
            fi
            if ! git log -1 --format='%B' "$sha" | grep -qF "Signed-off-by: $author"; then
              echo "::error::$sha has no 'Signed-off-by: $author'. Amend with 'git commit -s'."
              status=1
            fi
          done
          exit $status
