[workspace]
resolver = "3"
members = ["crates/*", "apps/desktop/src-tauri", "apps/mobile/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
authors = ["The Ghira Authors"]
publish = false

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "warn"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
# Symbols go to a dSYM (a release artifact) to read crash reports; the
# shipped binaries carry none.
strip = "symbols"
debug = "line-tables-only"
split-debuginfo = "packed"

# Model files are hashed before every first load (RT-12); unoptimized SHA-256
# would take ~25 s per 700 MB model in debug builds.
[profile.dev.package.sha2]
opt-level = 3
