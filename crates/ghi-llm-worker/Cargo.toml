[package]
name = "ghi-llm-worker"
description = "llama.cpp worker run as a separate process, spoken to over stdio."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
default = ["engine"]
# The llama.cpp binding; the protocol types alone (no llama) are what `ghi-llm` uses.
engine = ["dep:llama-cpp-2"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ghi-diag = { path = "../ghi-diag" }
llama-cpp-2 = { version = "=0.1.157", default-features = false, features = ["common"], optional = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[[bin]]
name = "ghi-llm-worker"
path = "src/main.rs"
required-features = ["engine"]
