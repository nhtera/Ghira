[package]
name = "ghi-net"
description = "The only network egress point: policy-checked HTTP client and LAN listener guard."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
# ureq's `unversioned` resolver/connector API may change in minor releases: pinned.
# Not its `rustls` feature: that bundles webpki-roots (CDLA-Permissive-2.0). Roots
# come from the OS through rustls-platform-verifier; the crypto provider is ring.
ureq = { version = "=3.4.2", default-features = false, features = ["rustls-no-provider", "platform-verifier"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
sha2 = "0.10"
zeroize = "1"

[dev-dependencies]
tempfile = "3"
