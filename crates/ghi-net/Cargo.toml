[package]
name = "ghi-net"
description = "The only network egress point: policy-checked HTTP client and LAN listener guard."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
# ureq's `unversioned` resolver/connector API may change in minor releases: pinned.
# Not its `rustls` feature: that bundles webpki-roots (CDLA-Permissive-2.0). Roots
# come from the OS through rustls-platform-verifier; the crypto provider is ring.
ureq = { version = "=3.4.2", default-features = false, features = ["rustls-no-provider", "platform-verifier"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
log = "0.4"
sha2 = "0.11"
zeroize = "1"
# LAN sync (phase 15). The local interface list for the listener and mDNS.
if-addrs = "0.15"
# mDNS for the desktop and the CLI; pinned (spike Q10). Not enabled by the iOS
# build (no raw multicast there; NWBrowser instead): the `mdns` feature.
mdns-sd = { version = "=0.21.4", default-features = false, features = ["logging"], optional = true }
# The random instance name of the advertisement.
getrandom = { version = "0.2", optional = true }

[features]
mdns = ["dep:mdns-sd", "dep:getrandom"]

[dev-dependencies]
tempfile = "3"
