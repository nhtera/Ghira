[package]
name = "ghi-core"
description = "Session manager, job queue, aligner and pipeline orchestration."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# TypeScript types for the Tauri apps (tauri-specta).
specta = ["dep:specta"]
# NeMo-Speech.cpp engines (tools/scripts/build-nemo.sh first).
nemo = ["ghi-speech/nemo"]
# Speaker embeddings for voice profiles (CAM++ over tract; phase 14c).
voice = ["ghi-speech/voice", "dep:ghi-models"]

[dependencies]
crossbeam-channel = "0.5"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
zeroize = "1"
specta = { version = "=2.0.0-rc.25", features = ["derive"], optional = true }
ghi-audio = { path = "../ghi-audio" }
ghi-llm = { path = "../ghi-llm" }
ghi-models = { path = "../ghi-models", optional = true }
ghi-net = { path = "../ghi-net" }
ghi-speech = { path = "../ghi-speech" }
ghi-store = { path = "../ghi-store" }
ghi-text = { path = "../ghi-text" }
docx-rs = "0.4.22"

[dev-dependencies]
tempfile = "3"
hound = "3"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
