# Glossary pack, written in-house (not copied from any published list).
# Terms are spelled as they should appear in a transcript. Packs correct
# near-misses only (one edit, terms of 5+ letters), so words that are also
# common in everyday speech are left out on purpose.
id = "finance-en"
domain = "finance"
lang = "en"
needs_owner_review = false
