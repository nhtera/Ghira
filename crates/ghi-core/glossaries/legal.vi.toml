# SPDX-License-Identifier: Apache-2.0
# Glossary pack, written in-house (not copied from any published list).
# Terms are spelled as they should appear in a transcript. Words that are
# also common in everyday speech are left out on purpose: packs correct
# near-misses (one edit, terms of 5+ letters), so a common word in here
# would rewrite ordinary speech.
