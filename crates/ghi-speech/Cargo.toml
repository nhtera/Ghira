[package]
name = "ghi-speech"
description = "NeMo-Speech.cpp FFI and sherpa-onnx wrappers behind the Asr/Diarizer/Embedder traits."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true
# Lets dependents read the library dir (DEP_NEMO_SPEECH_ASR_C_LIBDIR) to set an rpath.
links = "nemo_speech_asr_c"

[features]
# Link NeMo-Speech.cpp. Build it first: tools/scripts/build-nemo.sh
nemo = ["dep:cc"]

[build-dependencies]
cc = { version = "1", optional = true }

[lints]
workspace = true
