[package]
name = "ghi-audio"
description = "PCM ring buffers, resampling, echo cancellation and the Ogg/Opus writer."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
ogg = "0.9"
opus = "0.4"
rtrb = "0.4"
rubato = "5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sonora = "0.2"
# Import decoders (MPL-2.0, file-level copyleft; allowed in deny.toml). No Opus
# decoder in Symphonia: Ogg Opus goes through the opus crate.
symphonia = { version = "0.5", default-features = false, features = ["adpcm", "aac", "aiff", "alac", "flac", "isomp4", "mkv", "mp3", "ogg", "pcm", "vorbis", "wav"] }

[dev-dependencies]
hound = "3"
