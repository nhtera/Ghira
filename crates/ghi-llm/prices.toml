# Cloud model prices, USD per 1M tokens, for the send preview's cost estimate,
# and the model menus: each provider's models in file order, the first one its
# default. A convenience only: providers change prices, so treat the estimate as
# approximate and override with `ghi notes --prices <file>` (same format).
# A model not listed here shows no cost estimate. `model` matches a model id
# exactly or as a prefix (dated snapshots such as claude-haiku-4-5-20251001;
# the longest listed prefix wins). The preview shows the likely cost (a typical
# answer, more for a model that thinks first) and, apart, at most (the whole
# answer allowance). `until` + `then_input`/`then_output`: an introductory price
# and the regular one after that day (UTC). `over_tokens` +
# `over_input`/`over_output`: the price of a prompt longer than that.
# Last reviewed 2026-10-09 against each provider's model list (GET /v1/models
# with a key) and its docs: only each provider's current generation, one model
# per tier. platform.claude.com/docs/en/about-claude/models/overview + /pricing,
# developers.openai.com/api/docs/models + /pricing,
# ai.google.dev/gemini-api/docs/models + /pricing.

[[model]]
provider = "openai"
model = "gpt-6.1-sol"
input = 2.00
output = 10.00

[[model]]
provider = "openai"
model = "gpt-6-luna"
input = 0.10
output = 0.50

[[model]]
provider = "openai"
model = "gpt-6-astra"
input = 10.00
output = 50.00

[[model]]
provider = "anthropic"
model = "claude-sonnet-5-5"
input = 2.00
output = 10.00

[[model]]
provider = "anthropic"
model = "claude-haiku-5-5"
input = 0.10
output = 0.50
over_tokens = 100000
over_input = 0.50
over_output = 2.50

[[model]]
provider = "anthropic"
model = "claude-opus-5-5"
input = 4.00
output = 20.00

[[model]]
provider = "anthropic"
model = "claude-fable-5-1"
input = 10.00
output = 50.00

# 0.75 / 3.75 is an introductory price until 2026-12-31, then 1.50 / 7.50.
[[model]]
provider = "gemini"
model = "gemini-3.8-flash"
input = 0.75
output = 3.75
until = "2026-12-31"
then_input = 1.50
then_output = 7.50

[[model]]
provider = "gemini"
model = "gemini-3.5-flash-lite"
input = 0.30
output = 2.50

# Shut down or deprecated by the provider, or replaced by a newer model of the
# same tier (`successor`): a saved choice with one of these prefixes moves to
# its successor, else to the provider's default (`Prices::current_model`).
[[retired]]
provider = "openai"
model = "gpt-4.1-mini"
successor = "gpt-6-luna"

[[retired]]
provider = "openai"
model = "gpt-6-sol"
successor = "gpt-6.1-sol"

[[retired]]
provider = "anthropic"
model = "claude-haiku-4"
successor = "claude-haiku-5-5"

[[retired]]
provider = "anthropic"
model = "claude-sonnet-4-5"

[[retired]]
