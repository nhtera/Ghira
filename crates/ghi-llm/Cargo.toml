[package]
name = "ghi-llm"
description = "Client for the LLM worker process, prompts, JSON schemas, cloud providers and redaction."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# The engine on a thread of this process instead of the worker binary (iOS).
inproc = ["ghi-llm-worker/engine"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
toml = "1"
ghi-diag = { path = "../ghi-diag" }
ghi-text = { path = "../ghi-text" }
ghi-llm-worker = { path = "../ghi-llm-worker", default-features = false }
ghi-models = { path = "../ghi-models" }
ghi-net = { path = "../ghi-net" }
regex = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
proptest = "1"
