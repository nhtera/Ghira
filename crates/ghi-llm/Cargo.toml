[package]
name = "ghi-llm"
description = "Client for the LLM worker process, prompts, JSON schemas, cloud providers and redaction."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
ghi-text = { path = "../ghi-text" }
ghi-llm-worker = { path = "../ghi-llm-worker", default-features = false }
ghi-models = { path = "../ghi-models" }
ghi-net = { path = "../ghi-net" }
regex = "1"

[dev-dependencies]
proptest = "1"
