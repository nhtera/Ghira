[package]
name = "ghi-desktop"
description = "Ghira desktop app (Tauri 2 shell over the Rust core)."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true

[lib]
# The `_lib` suffix keeps the lib name distinct from the bin name (cargo#8519 on Windows).
name = "ghi_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# Speech engines (NeMo-Speech.cpp; tools/scripts/build-nemo.sh first).
nemo = ["ghi-core/nemo", "ghi-speech/nemo"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# No shell or http plugins: the webview never touches the network or spawns
# processes; all I/O goes through Rust commands and `ghi-net`.
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
specta = "=2.0.0-rc.25"
tauri-specta = { version = "=2.0.0-rc.25", features = ["derive", "typescript"] }
specta-typescript = "=0.0.12"
ghi-audio = { path = "../../../crates/ghi-audio" }
ghi-core = { path = "../../../crates/ghi-core", features = ["specta"] }
ghi-llm = { path = "../../../crates/ghi-llm" }
ghi-models = { path = "../../../crates/ghi-models" }
ghi-net = { path = "../../../crates/ghi-net" }
ghi-speech = { path = "../../../crates/ghi-speech" }
ghi-store = { path = "../../../crates/ghi-store" }
serde_json = "1"
rand_core = { version = "0.6", features = ["getrandom"] }

[lints]
workspace = true
