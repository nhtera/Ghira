[package]
name = "ghi-desktop"
description = "Ghira desktop app (Tauri 2 shell over the Rust core)."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true

[lib]
# The `_lib` suffix keeps the lib name distinct from the bin name (cargo#8519 on Windows).
name = "ghi_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# Speech engines (NeMo-Speech.cpp; tools/scripts/build-nemo.sh first).
nemo = ["ghi-app/nemo", "ghi-core/nemo", "ghi-speech/nemo"]
# Whisper large-v3-turbo final pass, opt-in by the `asr_final` setting (build-whisper.sh first).
whisper = ["ghi-app/whisper", "ghi-core/whisper", "ghi-speech/whisper"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# No shell or http plugins: the webview never touches the network or spawns
# processes; all I/O goes through Rust commands and `ghi-net`.
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
specta = "=2.0.0-rc.25"
tauri-specta = { version = "=2.0.0-rc.25", features = ["derive", "typescript"] }
specta-typescript = "=0.0.12"
ghi-app = { path = "../../../crates/ghi-app", features = ["local-llm", "embeddings", "voice", "specta", "mdns"] }
ghi-audio = { path = "../../../crates/ghi-audio" }
ghi-core = { path = "../../../crates/ghi-core", features = ["specta", "voice"] }
ghi-diag = { path = "../../../crates/ghi-diag" }
ghi-llm = { path = "../../../crates/ghi-llm" }
ghi-models = { path = "../../../crates/ghi-models" }
ghi-net = { path = "../../../crates/ghi-net" }
ghi-speech = { path = "../../../crates/ghi-speech" }
ghi-store = { path = "../../../crates/ghi-store" }
ghi-text = { path = "../../../crates/ghi-text" }
ghi-update = { path = "../../../crates/ghi-update" }
log = "0.4"
zeroize = "1"
serde_json = "1"
rand_core = { version = "0.6", features = ["getrandom"] }
rfd = "0.17"

[target.'cfg(target_os = "macos")'.dependencies]
# Non-activating panels for the menu-bar popover and the mini-recorder.
tauri-nspanel = "2.1"
objc2-app-kit = { version = "0.3", features = ["NSWindow"] }
# App lock: Touch ID / the login password (LocalAuthentication).
objc2-local-authentication = { version = "0.3", features = ["LAContext", "block2"] }
objc2-foundation = { version = "0.3", features = ["NSString", "NSError", "NSDate", "NSArray", "NSURL", "NSPredicate"] }
# Calendar events (phase 14d): EventKit, read on demand.
objc2-event-kit = { version = "0.3", features = ["EKEventStore", "EKEvent", "EKParticipant", "EKCalendarItem", "EKCalendar", "EKTypes", "EKObject", "block2"] }
block2 = "0.6"
objc2 = "0.6"
core-foundation = "0.10"

[dev-dependencies]
ghi-app = { path = "../../../crates/ghi-app", features = ["test-support"] }
tempfile = "3"
hound = "3"

[target.'cfg(unix)'.dev-dependencies]
libc = "0.2"

[lints]
workspace = true
