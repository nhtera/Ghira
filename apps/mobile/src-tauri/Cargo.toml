[package]
name = "ghi-mobile"
description = "Ghira iOS app: Tauri 2 shell, Swift audio over a C ABI, the shared ghi-app commands."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true

[lib]
name = "ghi_mobile_lib"
# iOS links the static library into the Xcode app target, where the Swift side
# of the C ABI lives. No cdylib: it would need those Swift symbols at link time.
crate-type = ["staticlib", "rlib"]

[features]
# Live ASR + diarization (NeMo-Speech.cpp). iOS: tools/scripts/build-nemo-ios.sh.
nemo = ["ghi-speech/nemo", "ghi-app/nemo", "ghi-core/nemo"]
# Test-only hooks for the Simulator harness (fake mic, Darwin-notification
# triggers). Paired with the Swift condition GHI_TEST_HOOKS; on only for
# `build-ios.sh --sim --test-hooks`, never in a release or device build.
test-hooks = []

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# No shell, http, fs or opener plugins: the webview never touches the network.
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
specta = "=2.0.0-rc.25"
tauri-specta = { version = "=2.0.0-rc.25", features = ["derive", "typescript"] }
specta-typescript = "=0.0.12"
ghi-app = { path = "../../../crates/ghi-app", default-features = false, features = ["specta", "voice"] }
ghi-core = { path = "../../../crates/ghi-core", features = ["specta", "voice"] }
ghi-audio = { path = "../../../crates/ghi-audio" }
ghi-models = { path = "../../../crates/ghi-models" }
# Model downloads only (ghi-net is the one network egress point).
ghi-net = { path = "../../../crates/ghi-net" }
ghi-diag = { path = "../../../crates/ghi-diag" }
ghi-speech = { path = "../../../crates/ghi-speech" }
ghi-store = { path = "../../../crates/ghi-store" }
crossbeam-channel = "0.5"
log = "0.4"
# The sealed backlog: an ephemeral in-memory key, per-record AEAD.
chacha20poly1305 = "0.10"
rand_core = { version = "0.6", features = ["getrandom"] }
zeroize = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "ios")'.dependencies]
# The App Group container (the share extension's inbox).
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSFileManager", "NSURL", "NSString"] }

[lints]
workspace = true

[dev-dependencies]
tempfile = "3"
hound = "3"
ghi-app = { path = "../../../crates/ghi-app", default-features = false, features = ["specta", "voice", "test-support"] }
