# SPDX-License-Identifier: Apache-2.0
# Generated by `tauri ios init`, then edited for Ghira (marked "Ghira:").
# Don't re-run `tauri ios init`: it overwrites this file.
name: ghi-mobile
options:
  bundleIdPrefix: com.nhtera.ghira
  deploymentTarget:
    iOS: 17.0
fileGroups: [../../src]
configs:
  debug: debug
  release: release
settingGroups:
  app:
    base:
      PRODUCT_NAME: Ghira
      PRODUCT_BUNDLE_IDENTIFIER: com.nhtera.ghira
targetTemplates:
  app:
    type: application
    sources:
      - path: Sources
    scheme:
      environmentVariables:
        RUST_BACKTRACE: full
        RUST_LOG: info
    settings:
      groups: [app]
targets:
  ghi-mobile_iOS:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Assets.xcassets
      # Exclude built static libs: regenerating with xcodegen after a build
      # otherwise turns the per-configuration libapp.a copies into colliding
      # resources ("Multiple commands produce …/libapp.a"). They are linked
      # via LIBRARY_SEARCH_PATHS, never bundled as resources.
      - path: Externals
        excludes: ["**/*.a"]
      - path: ghi-mobile_iOS
      - path: assets
        buildPhase: resources
        type: folder
      - path: LaunchScreen.storyboard
      # Ghira: Swift audio + lifecycle over the C ABI, and the Live Activity
      # model/intents shared with the widget extension.
      - path: ../../../../../native/ios/GhiAudio
        excludes: ["include/**"]
      - path: ../../../../../native/ios/Shared
      # Ghira: privacy manifest (app + both extensions) and the en/vi
      # InfoPlist.strings (permission prompts).
      - path: ../../../../../native/ios/PrivacyInfo.xcprivacy
        buildPhase: resources
      - path: ../../../../../native/ios/Resources
        buildPhase: resources
    info:
      path: ghi-mobile_iOS/Info.plist
      properties:
        LSRequiresIPhoneOS: true
        UILaunchStoryboardName: LaunchScreen
        UIRequiredDeviceCapabilities: [arm64, metal]
        # Ghira: iPhone only, portrait only (plan 16 D7).
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        CFBundleDisplayName: Ghira
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, vi]
        CFBundleShortVersionString: 0.1.0
        CFBundleVersion: "0.1.0"
        # Ghira: record with the screen locked, Live Activity. No file sharing
        # keys: recordings never appear in the Files app (they are encrypted).
        UIBackgroundModes: [audio]
        NSMicrophoneUsageDescription: Ghira records meetings on this phone. Audio stays on the device.
        NSFaceIDUsageDescription: Ghira uses Face ID to unlock your meetings when app lock is on.
        NSSupportsLiveActivities: true
    entitlements:
      path: ghi-mobile_iOS/ghi-mobile_iOS.entitlements
      properties:
        # Ghira: NeMo-Speech.cpp's scheduler reserves ~1.3 GB of (mostly
        # untouched) host memory per session; the default iOS limits refuse it.
        com.apple.developer.kernel.increased-memory-limit: true
        com.apple.developer.kernel.extended-virtual-addressing: true
        # Ghira: shared with the share extension (inbox) and the widget.
        com.apple.security.application-groups: [group.com.nhtera.ghira]
    scheme:
      environmentVariables:
        RUST_BACKTRACE: full
        RUST_LOG: info
    settings:
      base:
        ENABLE_BITCODE: false
        ARCHS: [arm64]
        VALID_ARCHS: arm64 
        LIBRARY_SEARCH_PATHS[arch=x86_64]: $(inherited) $(PROJECT_DIR)/Externals/x86_64/$(CONFIGURATION) $(SDKROOT)/usr/lib/swift $(DEVELOPER_DIR)/Toolchains/XcodeDefault.xctoolchain/usr/lib/swift/$(PLATFORM_NAME) $(DEVELOPER_DIR)/Toolchains/XcodeDefault.xctoolchain/usr/lib/swift-5.0/$(PLATFORM_NAME)
        LIBRARY_SEARCH_PATHS[arch=arm64]: $(inherited) $(PROJECT_DIR)/Externals/arm64/$(CONFIGURATION) $(SDKROOT)/usr/lib/swift $(DEVELOPER_DIR)/Toolchains/XcodeDefault.xctoolchain/usr/lib/swift/$(PLATFORM_NAME) $(DEVELOPER_DIR)/Toolchains/XcodeDefault.xctoolchain/usr/lib/swift-5.0/$(PLATFORM_NAME)
        ALWAYS_EMBED_SWIFT_STANDARD_LIBRARIES: true
        EXCLUDED_ARCHS[sdk=iphoneos*]: x86_64
        # Ghira: the C header for Swift (module GhiIOS); GHI_APP enables the
        # intents' calls into Rust (the widget extension has no Rust).
        SWIFT_INCLUDE_PATHS: $(inherited) $(PROJECT_DIR)/../../../../../native/ios/GhiAudio/include
        # GHI_TEST_HOOKS comes from build-ios.sh --sim --test-hooks (never release).
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) GHI_APP ${GHI_SWIFT_TEST_HOOKS}
        TARGETED_DEVICE_FAMILY: "1"
        DEVELOPMENT_TEAM: ${APPLE_DEVELOPMENT_TEAM}
        SWIFT_VERSION: "5.0"
      groups: [app]
    dependencies:
      - framework: libapp.a
        embed: false
      - sdk: CoreGraphics.framework
      - sdk: Metal.framework
      - sdk: MetalKit.framework
      - sdk: QuartzCore.framework
      - sdk: Security.framework
      - sdk: UIKit.framework
      - sdk: WebKit.framework
      # Ghira: NeMo-Speech.cpp (tools/scripts/build-nemo-ios.sh), audio, Live Activity.
      - framework: ../../../../../target/nemo-ios/nemo_speech_asr.xcframework
        embed: true
        codeSign: true
      - framework: ../../../../../target/nemo-ios/nemo_speech_asr_c.xcframework
        embed: true
        codeSign: true
      - sdk: AVFoundation.framework
      - sdk: Accelerate.framework
      # Wi-Fi-only model downloads (models_cmd: SCNetworkReachability).
      - sdk: SystemConfiguration.framework
      - sdk: ActivityKit.framework
      - target: GhiLiveActivity
        embed: true
      - target: GhiShareExtension
        embed: true
    preBuildScripts:
      - script: |
          pnpm tauri ios xcode-script -v --platform "${PLATFORM_DISPLAY_NAME:?}" --sdk-root "${SDKROOT:?}" --framework-search-paths "${FRAMEWORK_SEARCH_PATHS:?}" --header-search-paths "${HEADER_SEARCH_PATHS:?}" --gcc-preprocessor-definitions "${GCC_PREPROCESSOR_DEFINITIONS:-}" --configuration "${CONFIGURATION:?}" ${FORCE_COLOR} ${ARCHS:?}
        name: Build Rust Code
        basedOnDependencyAnalysis: false
        outputFiles:
          - $(SRCROOT)/Externals/x86_64/${CONFIGURATION}/libapp.a
          - $(SRCROOT)/Externals/arm64/${CONFIGURATION}/libapp.a
  # Ghira: the recording Live Activity (lock screen + Dynamic Island).
  GhiLiveActivity:
    type: app-extension
    platform: iOS
    sources:
      - path: ../../../../../native/ios/GhiLiveActivity
      - path: ../../../../../native/ios/Shared
      - path: ../../../../../native/ios/PrivacyInfo.xcprivacy
        buildPhase: resources
    info:
      path: GhiLiveActivity/Info.plist
      properties:
        CFBundleDisplayName: Ghira
        CFBundleShortVersionString: 0.1.0
        CFBundleVersion: "0.1.0"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: GhiLiveActivity/GhiLiveActivity.entitlements
      properties:
        com.apple.security.application-groups: [group.com.nhtera.ghira]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nhtera.ghira.LiveActivity
        TARGETED_DEVICE_FAMILY: "1"
        # Set at generation time by apps/mobile/scripts/build-ios.sh (not committed).
        DEVELOPMENT_TEAM: ${APPLE_DEVELOPMENT_TEAM}
        CODE_SIGN_STYLE: Automatic
        PRODUCT_NAME: GhiLiveActivity
        SWIFT_VERSION: "5.0"
        ARCHS: [arm64]
        EXCLUDED_ARCHS[sdk=iphoneos*]: x86_64
    dependencies:
      - sdk: SwiftUI.framework
      - sdk: WidgetKit.framework
      - sdk: ActivityKit.framework
  # Ghira: share extension "Open in Ghira" (M5). A stub here; 16-E fills it in.
  GhiShareExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: ../../../../../native/ios/GhiShareExtension
      - path: ../../../../../native/ios/PrivacyInfo.xcprivacy
        buildPhase: resources
    info:
      path: GhiShareExtension/Info.plist
      properties:
        CFBundleDisplayName: Ghira
        CFBundleShortVersionString: 0.1.0
        CFBundleVersion: "0.1.0"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule: SUBQUERY (extensionItems, $extensionItem, SUBQUERY ($extensionItem.attachments, $attachment, ANY $attachment.registeredTypeIdentifiers UTI-CONFORMS-TO "public.audio").@count >= 1).@count >= 1
    entitlements:
      path: GhiShareExtension/GhiShareExtension.entitlements
      properties:
        com.apple.security.application-groups: [group.com.nhtera.ghira]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nhtera.ghira.ShareExtension
        DEVELOPMENT_TEAM: ${APPLE_DEVELOPMENT_TEAM}
        CODE_SIGN_STYLE: Automatic
        PRODUCT_NAME: GhiShareExtension
        SWIFT_VERSION: "5.0"
        ARCHS: [arm64]
        EXCLUDED_ARCHS[sdk=iphoneos*]: x86_64
        TARGETED_DEVICE_FAMILY: "1"
    dependencies:
      - sdk: UIKit.framework
      - sdk: UniformTypeIdentifiers.framework
