# SPDX-License-Identifier: Apache-2.0
# Generated by `tauri ios init`, then edited for Ghira (marked "Ghira:").
# Don't re-run `tauri ios init`: it overwrites this file.
name: ghi-mobile
options:
  bundleIdPrefix: com.nhtera.ghira.spike
  deploymentTarget:
    iOS: 17.0
fileGroups: [../../src]
configs:
  debug: debug
  release: release
settingGroups:
  app:
    base:
      PRODUCT_NAME: Ghira Spike
      PRODUCT_BUNDLE_IDENTIFIER: com.nhtera.ghira.spike
targetTemplates:
  app:
    type: application
    sources:
      - path: Sources
    scheme:
      environmentVariables:
        RUST_BACKTRACE: full
        RUST_LOG: info
    settings:
      groups: [app]
targets:
  ghi-mobile_iOS:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Assets.xcassets
      # Exclude built static libs: regenerating with xcodegen after a build
      # otherwise turns the per-configuration libapp.a copies into colliding
      # resources ("Multiple commands produce …/libapp.a"). They are linked
      # via LIBRARY_SEARCH_PATHS, never bundled as resources.
      - path: Externals
        excludes: ["**/*.a"]
      - path: ghi-mobile_iOS
      - path: assets
        buildPhase: resources
        type: folder
      - path: LaunchScreen.storyboard
      # Ghira: Swift audio + lifecycle over the C ABI, and the Live Activity
      # model/intents shared with the widget extension.
      - path: ../../../../../native/ios/GhiAudio
        excludes: ["include/**"]
      - path: ../../../../../native/ios/Shared
    info:
      path: ghi-mobile_iOS/Info.plist
      properties:
        LSRequiresIPhoneOS: true
        UILaunchStoryboardName: LaunchScreen
        UIRequiredDeviceCapabilities: [arm64, metal]
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        CFBundleShortVersionString: 0.1.0
        CFBundleVersion: "0.1.0"
        # Ghira: record with the screen locked, Live Activity, and recordings
        # + metrics visible in the Files app (spike: the owner pulls them).
        UIBackgroundModes: [audio]
        NSMicrophoneUsageDescription: Ghira records meetings on this phone. Audio stays on the device.
        NSSupportsLiveActivities: true
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
    entitlements:
      path: ghi-mobile_iOS/ghi-mobile_iOS.entitlements
      properties:
        # Ghira: NeMo-Speech.cpp's scheduler reserves ~1.3 GB of (mostly
        # untouched) host memory per session; the default iOS limits refuse it.
        com.apple.developer.kernel.increased-memory-limit: true
        com.apple.developer.kernel.extended-virtual-addressing: true
    scheme:
      environmentVariables:
        RUST_BACKTRACE: full
        RUST_LOG: info
    settings:
      base:
        ENABLE_BITCODE: false
        ARCHS: [arm64]
        VALID_ARCHS: arm64 
        LIBRARY_SEARCH_PATHS[arch=x86_64]: $(inherited) $(PROJECT_DIR)/Externals/x86_64/$(CONFIGURATION) $(SDKROOT)/usr/lib/swift $(DEVELOPER_DIR)/Toolchains/XcodeDefault.xctoolchain/usr/lib/swift/$(PLATFORM_NAME) $(DEVELOPER_DIR)/Toolchains/XcodeDefault.xctoolchain/usr/lib/swift-5.0/$(PLATFORM_NAME)
        LIBRARY_SEARCH_PATHS[arch=arm64]: $(inherited) $(PROJECT_DIR)/Externals/arm64/$(CONFIGURATION) $(SDKROOT)/usr/lib/swift $(DEVELOPER_DIR)/Toolchains/XcodeDefault.xctoolchain/usr/lib/swift/$(PLATFORM_NAME) $(DEVELOPER_DIR)/Toolchains/XcodeDefault.xctoolchain/usr/lib/swift-5.0/$(PLATFORM_NAME)
        ALWAYS_EMBED_SWIFT_STANDARD_LIBRARIES: true
        EXCLUDED_ARCHS[sdk=iphoneos*]: x86_64
        # Ghira: the C header for Swift (module GhiIOS); GHI_APP enables the
        # intents' calls into Rust (the widget extension has no Rust).
        SWIFT_INCLUDE_PATHS: $(inherited) $(PROJECT_DIR)/../../../../../native/ios/GhiAudio/include
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) GHI_APP
        DEVELOPMENT_TEAM: ${APPLE_DEVELOPMENT_TEAM}
        SWIFT_VERSION: "5.0"
      groups: [app]
    dependencies:
      - framework: libapp.a
        embed: false
      - sdk: CoreGraphics.framework
      - sdk: Metal.framework
      - sdk: MetalKit.framework
      - sdk: QuartzCore.framework
      - sdk: Security.framework
      - sdk: UIKit.framework
      - sdk: WebKit.framework
      # Ghira: NeMo-Speech.cpp (tools/scripts/build-nemo-ios.sh), audio, Live Activity.
      - framework: ../../../../../target/nemo-ios/nemo_speech_asr.xcframework
        embed: true
        codeSign: true
      - framework: ../../../../../target/nemo-ios/nemo_speech_asr_c.xcframework
        embed: true
        codeSign: true
      - sdk: AVFoundation.framework
      - sdk: Accelerate.framework
      - sdk: ActivityKit.framework
      - target: GhiLiveActivity
        embed: true
    preBuildScripts:
      - script: |
          pnpm tauri ios xcode-script -v --platform "${PLATFORM_DISPLAY_NAME:?}" --sdk-root "${SDKROOT:?}" --framework-search-paths "${FRAMEWORK_SEARCH_PATHS:?}" --header-search-paths "${HEADER_SEARCH_PATHS:?}" --gcc-preprocessor-definitions "${GCC_PREPROCESSOR_DEFINITIONS:-}" --configuration "${CONFIGURATION:?}" ${FORCE_COLOR} ${ARCHS:?}
        name: Build Rust Code
        basedOnDependencyAnalysis: false
        outputFiles:
          - $(SRCROOT)/Externals/x86_64/${CONFIGURATION}/libapp.a
          - $(SRCROOT)/Externals/arm64/${CONFIGURATION}/libapp.a
  # Ghira: the recording Live Activity (lock screen + Dynamic Island).
  GhiLiveActivity:
    type: app-extension
    platform: iOS
    sources:
      - path: ../../../../../native/ios/GhiLiveActivity
      - path: ../../../../../native/ios/Shared
    info:
      path: GhiLiveActivity/Info.plist
      properties:
        CFBundleDisplayName: Ghira Spike
        CFBundleShortVersionString: 0.1.0
        CFBundleVersion: "0.1.0"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nhtera.ghira.spike.LiveActivity
        # Set at generation time by apps/mobile/scripts/build-ios.sh (not committed).
        DEVELOPMENT_TEAM: ${APPLE_DEVELOPMENT_TEAM}
        CODE_SIGN_STYLE: Automatic
        PRODUCT_NAME: GhiLiveActivity
        SWIFT_VERSION: "5.0"
        ARCHS: [arm64]
        EXCLUDED_ARCHS[sdk=iphoneos*]: x86_64
    dependencies:
      - sdk: SwiftUI.framework
      - sdk: WidgetKit.framework
      - sdk: ActivityKit.framework
