[project]
name = "ghi-eval"
version = "0.1.0"
description = "Ghira eval kit: scores ASR, diarization, streaming lag and meeting notes on a customer dataset."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
  "pyannote.metrics>=3.2",
  "jiwer>=3.0",
  "psutil>=5.9",
  "pyyaml>=6.0",
  "jsonschema>=4.20",
  "numpy>=1.26",
]

[project.optional-dependencies]
nemo = ["nemo_toolkit[asr]"]
whisper = ["faster-whisper"]

[project.scripts]
ghi-eval = "ghi_eval.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ghi_eval"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["data", "runs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]  # `ruff format` wraps code; long comments and strings are fine
